
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GoBro — Online Booking</title>
<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  background: #101010;
  color: white;
  font-family: Arial, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 25px;
}

.container {
  width: 100%;
  max-width: 520px;
  text-align: center;
}

.logo {
  color: #e7c75b;
  font-size: 48px;
  font-weight: 900;
  letter-spacing: 2px;
}

.subtitle {
  color: #aaa;
  letter-spacing: 5px;
  font-size: 13px;
  margin: 8px 0 35px;
}

h1 {
  font-size: 27px;
  margin-bottom: 12px;
}

.description {
  color: #aaa;
  line-height: 1.6;
  margin-bottom: 30px;
}

.booking-button {
  display: block;
  padding: 19px;
  background: #e7c75b;
  color: #171717;
  text-decoration: none;
  font-weight: bold;
  border-radius: 9px;
  font-size: 16px;
  transition: .2s;
}

.booking-button:hover {
  background: #f5dc83;
  transform: translateY(-2px);
}

.price {
  margin-top: 25px;
  color: #e7c75b;
  font-size: 18px;
}

.cars {
  margin-top: 35px;
  border-top: 1px solid #444;
  padding-top: 25px;
  color: #bbb;
  line-height: 2;
}

footer {
  margin-top: 45px;
  color: #666;
  font-size: 12px;
}
</style>
</head>

<body>
<div class="container">

  <div class="logo">GoBro</div>
  <div class="subtitle">ONLINE BOOKING</div>

  <h1>Запишись на вождение</h1>

  <div class="description">
    Выбери удобное время и автомобиль.<br>
    Мы ждём тебя на занятии!
  </div>

  <a class="booking-button"
     href="https://script.google.com/macros/s/AKfycbzefnQGjpJ6agNwuflDMvryif_K8Z8X_4AxX4cg8Bd8ep8LXoEkwiuy1y2KXb4BktR-/exec">
     ЗАПИСАТЬСЯ НА ВОЖДЕНИЕ
  </a>

  <div class="price">45 € / 90 минут</div>

  <div class="cars">
    <div>🚗 Kia Ceed — механика</div>
    <div>🚘 Toyota Corolla — автомат</div>
  </div>

  <footer>
    GoBro Driving · Riga
  </footer>

</div>
</body>
</html>
